name: Check

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and test (defaults to the triggering ref)
        type: string
        default: ''
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # empty ref → checkout's default (the triggering ref); set by callers to test a branch
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          # only main writes caches, branches and PRs just read
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # icons and sidecars are gitignored, tauri's build script needs them to exist; empty
      # placeholders do for linting, the tests that run the real tools are skipped
      - name: Generate icons and sidecar placeholders
        run: bun run generate:icons && bun run generate:sidecars:stub

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # Off for now: clippy for the code only Windows compiles (single instance, no console for the
