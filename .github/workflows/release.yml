name: Build and Release

on:
  push:
    # a push to `release-try/…` runs everything up to the publishing and then drops the draft: a
    # dry run of the builds and the manifest that spends no version
    branches: [main, 'release-try/**']
    paths-ignore:
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Release pipeline is gated on the shared check workflow (typecheck, lint, test).
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  # Compute the bump without touching the remote; hand it to later jobs as a patch.
  prepare:
    name: Prepare version bump
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.prep.outputs.version }}
      should_release: ${{ steps.prep.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute version bump
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release only if commits landed since the last tag; the release commit itself
          # (chore: release) is the tag target, so it never triggers another release.
          last_tag=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ "$DRY_RUN" != "true" ] && [ -n "$last_tag" ] && [ "$(git rev-list --count "${last_tag}..HEAD")" -eq 0 ]; then
            echo "No commits since ${last_tag}; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # release-it bumps package.json/CHANGELOG/Cargo/tauri.conf via hooks;
          # --no-git keeps it local so the release job pushes only after build.
          bunx release-it --ci --no-git
          version=$(jq -r .version package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Prepared release ${version}"

      - name: Create bump patch
        if: steps.prep.outputs.should_release == 'true'
        run: git diff HEAD > bump.patch

      - name: Upload bump patch
        if: steps.prep.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump
          path: bump.patch
          retention-days: 1

  # One draft release for all builds (hidden from the updater until published); the builds upload
  # into it by its id, none of them looks for or creates one.
  create-release:
    name: Create draft release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - name: Create draft release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # the id from the answer: a list of releases read right after does not have the draft yet,
          # and tauri-action without an id builds and uploads nothing, without failing
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name="v${VERSION}" -f target_commitish=main -f name="E-RNG v${VERSION}" \
            -f body="See the assets to download this version and install." -F draft=true --jq .id)
          test -n "$id"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  # Build the app into the draft, one leg per platform; all or nothing.
  build:
    name: Build (${{ matrix.label }})
    needs: [prepare, create-release]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macos aarch64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Cross-compiled on Linux rather than built on a Windows runner, as in devkit: quicker
          # runners, NSIS builds there too. The sidecars link the Windows JRE with the Linux JDK's
          # jlink (scripts/sidecars.ts); the tools themselves are not run on
          # Windows in CI for now (the job is commented out in check.yml).
          - label: windows x86_64
            platform: ubuntu-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --runner cargo-xwin
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Download bump patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump

      - name: Apply version bump
        run: git apply bump.patch

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # mustang and the JDKs are fetched (and checksum-verified) by `bun run generate`
      - name: Cache sidecar downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sidecars
          key: ${{ runner.os }}-${{ matrix.target }}-sidecars-${{ hashFiles('scripts/sidecars.json') }}

      - name: Cache cargo-xwin and the Windows SDK it downloads
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cache/cargo-xwin
          key: cargo-xwin-${{ runner.os }}-v1

      # cargo-xwin brings the Windows SDK and CRT; NSIS builds the installer, tauri looks for it by
      # its Windows name
      - name: Install the Windows cross toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q llvm clang lld nsis
          sudo ln -sf "$(command -v makensis)" /usr/local/bin/makensis.exe
          command -v cargo-xwin >/dev/null 2>&1 || cargo install --locked cargo-xwin

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # macOS keeps the key it had before the matrix, so its warm cache carries over
          key: ${{ matrix.target != 'aarch64-apple-darwin' && matrix.target || '' }}
          # only main writes caches, branches and PRs just read
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          # one manifest for all platforms, written after all builds (manifest job)
          uploadUpdaterJson: false
          # a dry run drops its draft: the bundles stay with the run, to be tried
          uploadWorkflowArtifacts: ${{ github.ref != 'refs/heads/main' }}
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

  # Every platform built: the updater manifest from the uploaded bundles and their signatures.
  manifest:
    name: Write updater manifest
    needs: [prepare, create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Write and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun scripts/updater-manifest.ts "${{ needs.create-release.outputs.id }}" latest.json
          gh release upload "v${VERSION}" latest.json --clobber --repo "${{ github.repository }}"

  # Build passed: commit the bump, move the tag onto it, publish the draft.
  # First and only job that mutates main/tags/releases.
  release:
    name: Commit bump and publish release
    needs: [prepare, manifest]
    if: needs.prepare.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Download bump patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump

      - name: Configure git
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

      - name: Commit version bump and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git apply bump.patch
          rm bump.patch
          git add -A
          git commit -m "chore: release ${VERSION}"
          git push origin HEAD:main
          # Move tauri-action's tag onto the release commit.
          git tag -f "v${VERSION}" -m "E-RNG ${VERSION}"
          git push -f origin "v${VERSION}"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"

  # The updater reads latest.json from a dedicated branch; created on first run.
  publish-manifest:
    name: Publish updater manifest
    needs: [prepare, release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "v${{ needs.prepare.outputs.version }}" --clobber -p latest.json -O "$RUNNER_TEMP/latest.json"

      - name: Commit and push manifest
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git switch gh-e-rng-latest 2>/dev/null || git switch --orphan gh-e-rng-latest
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: update updater manifest to v${{ needs.prepare.outputs.version }}"
          git push origin gh-e-rng-latest

  # Build failed, or a dry run: drop the draft release + tag so the version is not consumed.
  cleanup:
    name: Clean up failed release
    needs: [prepare, create-release, build, manifest]
    if: ${{ always() && needs.prepare.outputs.should_release == 'true' && (contains(needs.*.result, 'failure') || github.ref != 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete draft release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release delete "v${VERSION}" --yes --cleanup-tag --repo "${{ github.repository }}" || \
            echo "No release/tag to clean up for v${VERSION}."
