name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: false

jobs:
  # Release pipeline is gated on the shared check workflow (typecheck, lint, test).
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  # Compute the bump without touching the remote; hand it to later jobs as a patch.
  prepare:
    name: Prepare version bump
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.prep.outputs.version }}
      should_release: ${{ steps.prep.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute version bump
        id: prep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release only if commits landed since the last tag; the release commit itself
          # (chore: release) is the tag target, so it never triggers another release.
          last_tag=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          if [ -n "$last_tag" ] && [ "$(git rev-list --count "${last_tag}..HEAD")" -eq 0 ]; then
            echo "No commits since ${last_tag}; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # release-it bumps package.json/CHANGELOG/Cargo/tauri.conf via hooks;
          # --no-git keeps it local so the release job pushes only after build.
          bunx release-it --ci --no-git
          version=$(jq -r .version package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "Prepared release ${version}"

      - name: Create bump patch
        if: steps.prep.outputs.should_release == 'true'
        run: git diff HEAD > bump.patch

      - name: Upload bump patch
        if: steps.prep.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump
          path: bump.patch
          retention-days: 1

  # Build the app into a DRAFT release (hidden from the updater until published).
  build:
    name: Build (macos aarch64)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download bump patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump

      - name: Apply version bump
        run: git apply bump.patch

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # typst, mustang and the JRE are fetched (and checksum-verified) by `bun run generate`
      - name: Cache sidecar downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sidecars
          key: ${{ runner.os }}-sidecars-${{ hashFiles('scripts/sidecars.json') }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: "E-Rng v${{ needs.prepare.outputs.version }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          tauriScript: bunx tauri
          args: --target aarch64-apple-darwin

  # Build passed: commit the bump, move the tag onto it, publish the draft.
  # First and only job that mutates main/tags/releases.
  release:
    name: Commit bump and publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Download bump patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump

      - name: Configure git
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"

      - name: Commit version bump and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git apply bump.patch
          rm bump.patch
          git add -A
          git commit -m "chore: release ${VERSION}"
          git push origin HEAD:main
          # Move tauri-action's tag onto the release commit.
          git tag -f "v${VERSION}" -m "E-Rng ${VERSION}"
          git push -f origin "v${VERSION}"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --repo "${{ github.repository }}"

  # The updater reads latest.json from a dedicated branch; created on first run.
  publish-manifest:
    name: Publish updater manifest
    needs: [prepare, release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "v${{ needs.prepare.outputs.version }}" --clobber -p latest.json -O "$RUNNER_TEMP/latest.json"

      - name: Commit and push manifest
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git switch gh-e-rng-latest 2>/dev/null || git switch --orphan gh-e-rng-latest
          cp "$RUNNER_TEMP/latest.json" latest.json
          git add latest.json
          git diff --cached --quiet || git commit -m "chore: update updater manifest to v${{ needs.prepare.outputs.version }}"
          git push origin gh-e-rng-latest

  # Build failed: drop the draft release + tag so the version is not consumed.
  cleanup:
    name: Clean up failed release
    needs: [prepare, build]
    if: ${{ failure() && needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete draft release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release delete "v${VERSION}" --yes --cleanup-tag --repo "${{ github.repository }}" || \
            echo "No release/tag to clean up for v${VERSION}."
