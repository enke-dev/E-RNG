name: Windows

# Clippy for the code only Windows compiles (single instance, no console for the tools, `.exe`
# paths) and the tests with the real tools on Windows: the release cross-builds Windows on Linux,
# which cannot run them. Started by hand, about 15 minutes: too slow to hold up every release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (Clippy and Test with the real tools)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache sidecar downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sidecars
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-sidecars-${{ hashFiles('scripts/sidecars.json') }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons and sidecars
        run: bun run generate

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test with the real tools
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --include-ignored
