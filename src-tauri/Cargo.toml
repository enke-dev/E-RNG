[package]
name = "e_rng"
version = "0.8.2"
description = "Desktop app to create ZUGFeRD/Factur-X invoices and XRechnung XML"
authors = ["David Enke <de@enke.dev>"]
edition = "2021"

[lib]
# the `_lib` suffix keeps the lib name unique, it would conflict with the bin name on Windows
name = "e_rng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
en16931 = { version = "0.8.0", features = ["serde", "chrono"] }
en16931-formats = { version = "0.8.0", default-features = false, features = ["cii"] }
tempfile = "3"
roxmltree = "0.21"
rust_decimal = "1"
anyhow = "1"
# Windows hands out resource paths as `\\?\C:\…`, which the Java launcher cannot take
dunce = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ttf-parser = "0.25.1"
imagesize = "0.15.0"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# exact: the backup format depends on it; deflate only, no encryption or other codecs
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# exact: the version of the Typst CLI the output was verified against
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["datetime", "embedded-fonts"] }
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
phonenumber = "0.3"

# a file opened with the app starts a second process there, it hands its arguments to the first
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
rust_decimal = "1"
rust_decimal_macros = "1"
typst-render = "=0.15.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `#[tauri::command]` hands `State` and the arguments over by value
needless_pass_by_value = "allow"
# settings and layout formats are flat sets of switches the UI stores one by one
struct_excessive_bools = "allow"
# array methods over loops, also for side effects
needless_for_each = "allow"
# `assert!(!x.is_empty())` has nothing more to show when it fails
assert_is_empty = "allow"

# one codegen unit and no symbols: 78 → 51 MB at about the same build time; LTO was measured and
# saves little more (49 MB, 16.0 instead of 16.2 MB packed) for twice the build time
[profile.release]
codegen-units = 1
strip = true
